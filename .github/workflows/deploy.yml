name: Deploy Pratheesh OS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Minimal required permissions for official GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: npm ci --prefix server

      - name: Build Application & Prerender Static HTML
        run: npm run build

      - name: Verify Admin Build Entry Point Safety Gate
        run: |
          if [ ! -f "dist/admin/index.html" ]; then
            echo "❌ CRITICAL BUILD FAILURE: dist/admin/index.html is missing!"
            exit 1
          fi
          echo "✅ Verified: dist/admin/index.html exists."

      - name: Setup Pages Infrastructure
        uses: actions/configure-pages@v5

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

