<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pratheesh Clement | Loading...</title>
  <!-- GitHub Pages SPA Redirect — encodes path into query string for client-side routing -->
  <script>
    // Split the URL at the repository name (for project pages) or domain root
    var segmentCount = 0; // 0 = user/org site (username.github.io/), 1 = project site
    var l = window.location;
    // Encode the path + query + hash and redirect to root with ?p= parameter
    var path = l.pathname.slice(1); // strip leading /
    if (path) {
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        path.split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    } else {
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/');
    }
  </script>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; padding: 40px; color: #475569;">
    Loading Pratheesh OS...
  </p>
</body>
</html>
