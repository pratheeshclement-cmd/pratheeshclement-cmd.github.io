<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0c18"/>
      <stop offset="100%" stop-color="#07060c"/>
    </linearGradient>
    <!-- Gold gradient for letters -->
    <linearGradient id="gold-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2c98a"/>
      <stop offset="50%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#8a6f3f"/>
    </linearGradient>
    <!-- Gold gradient for border -->
    <linearGradient id="border-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2c98a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c8a96e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8a6f3f" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Inner glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#bg-grad)"/>

  <!-- Outer gold border -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="none"
        stroke="url(#border-grad)" stroke-width="1.2"/>

  <!-- Inner subtle border for depth -->
  <rect x="5" y="5" width="54" height="54" rx="10" fill="none"
        stroke="#c8a96e" stroke-width="0.3" opacity="0.2"/>

  <!-- Corner accent marks — top-left -->
  <path d="M8 16 L8 8 L16 8" fill="none" stroke="#c8a96e" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- top-right -->
  <path d="M48 8 L56 8 L56 16" fill="none" stroke="#c8a96e" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- bottom-left -->
  <path d="M8 48 L8 56 L16 56" fill="none" stroke="#c8a96e" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- bottom-right -->
  <path d="M48 56 L56 56 L56 48" fill="none" stroke="#c8a96e" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Very subtle background glow -->
  <ellipse cx="32" cy="30" rx="18" ry="16" fill="#c8a96e" opacity="0.04"/>

  <!-- "M" letter - elegant geometric serif style -->
  <text
    x="11" y="44"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    font-weight="700"
    font-style="italic" /* Kept as is */
    fill="url(#gold-grad)"
    filter="url(#glow)"
    letter-spacing="-1">M</text>

  <!-- "P" letter -->
  <text
    x="31" y="44"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    font-weight="700"
    font-style="italic" /* Kept as is */
    fill="url(#gold-grad)"
    letter-spacing="-1">P</text>

  <!-- Gold dot accent -->
  <circle cx="54" cy="42" r="2.5" fill="#e2c98a" opacity="0.9"/>
  <circle cx="54" cy="42" r="1.2" fill="#ffffff" opacity="0.5"/>

  <!-- Thin horizontal rule under letters -->
  <line x1="10" y1="47.5" x2="54" y2="47.5"
        stroke="#c8a96e" stroke-width="0.6" opacity="0.3"/>
</svg>
