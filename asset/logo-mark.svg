<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="lm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131020"/>
      <stop offset="100%" stop-color="#07060c"/>
    </linearGradient>
    <linearGradient id="lm-gm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0dfa0"/>
      <stop offset="45%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#7a5e2e"/>
    </linearGradient>
    <linearGradient id="lm-bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2c98a" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#c8a96e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8a6f3f" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="lm-diam" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e2c98a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c8a96e" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="outer-glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer glow ring -->
  <rect x="4" y="4" width="192" height="192" rx="40"
        fill="none" stroke="#c8a96e" stroke-width="1" opacity="0.12" filter="url(#lm-outer-glow)"/>

  <!-- Main card background -->
  <rect x="4" y="4" width="192" height="192" rx="38" fill="url(#lm-bg)"/>

  <!-- Border - gold gradient -->
  <rect x="4" y="4" width="192" height="192" rx="38" fill="none" stroke="url(#lm-bg2)" stroke-width="1.8"/>

  <!-- Inner fine border -->
  <rect x="10" y="10" width="180" height="180" rx="32"
        fill="none" stroke="#c8a96e" stroke-width="0.4" opacity="0.15"/>

  <!-- Ambient center glow -->
  <ellipse cx="100" cy="100" rx="60" ry="55" fill="#c8a96e" opacity="0.04"/>
  <ellipse cx="100" cy="80" rx="40" ry="30" fill="#c8a96e" opacity="0.03"/>

  <!-- Corner bracket ornaments -->
  <!-- TL -->
  <path d="M22 50 L22 22 L50 22" fill="none" stroke="#c8a96e"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- TR -->
  <path d="M150 22 L178 22 L178 50" fill="none" stroke="#c8a96e"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- BL -->
  <path d="M22 150 L22 178 L50 178" fill="none" stroke="#c8a96e"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- BR -->
  <path d="M150 178 L178 178 L178 150" fill="none" stroke="#c8a96e"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Diamond top ornament -->
  <polygon points="100,12 110,24 100,36 90,24" fill="url(#lm-diam)" opacity="0.85"/>
  <polygon points="100,12 110,24 100,36 90,24"
           fill="none" stroke="#e2c98a" stroke-width="1.2" opacity="0.7"/>
  <circle cx="100" cy="24" r="2.5" fill="#f8f0d8" opacity="0.9"/> <!-- Unique ID for logo-mark -->

  <!-- Diamond bottom ornament -->
  <polygon points="100,164 110,176 100,188 90,176"
           fill="none" stroke="#c8a96e" stroke-width="1.2" opacity="0.35"/>

  <!-- Horizontal decorative lines -->
  <line x1="20" y1="148" x2="180" y2="148"
        stroke="#c8a96e" stroke-width="0.5" opacity="0.18"/>

  <!-- "M" — large elegant italic serif -->
  <text
    x="22" y="142"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="108"
    font-weight="700"
    font-style="italic"
    fill="url(#lm-gm)"
    filter="url(#lm-glow2)"
    letter-spacing="-8">M</text>

  <!-- "P" -->
  <text
    x="100" y="142"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="108"
    font-weight="700"
    font-style="italic"
    fill="url(#lm-gm)"
    filter="url(#lm-glow2)"
    letter-spacing="-5">P</text>

  <!-- Gold dot — top right of letters -->
  <circle cx="183" cy="60" r="5.5" fill="#e2c98a" opacity="0.88"/>
  <circle cx="183" cy="60" r="2.5" fill="#ffffff" opacity="0.55"/>
  <circle cx="183" cy="60" r="8" fill="none" stroke="#c8a96e" stroke-width="0.6" opacity="0.35"/>

  <!-- Small "." below the dot — branding detail -->
  <text x="168" y="168" font-family="Georgia, serif" font-size="16"
        fill="#c8a96e" opacity="0.6" font-weight="700">.</text>
</svg>
