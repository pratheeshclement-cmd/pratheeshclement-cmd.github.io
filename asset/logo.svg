<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <!-- Background (transparent for versatility) -->

    <!-- Dark card bg for the monogram mark -->
    <linearGradient id="mark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131020"/>
      <stop offset="100%" stop-color="#07060c"/>
    </linearGradient>

    <!-- Gold gradient — main brand accent -->
    <linearGradient id="gold-main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0dfa0"/>
      <stop offset="40%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#7a5e2e"/>
    </linearGradient>

    <!-- Gold for name text -->
    <linearGradient id="gold-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2c98a"/>
      <stop offset="60%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#a07840"/>
    </linearGradient>

    <!-- Violet accent -->
    <linearGradient id="violet-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9b7fe8"/>
      <stop offset="100%" stop-color="#7b5fd0"/>
    </linearGradient>

    <!-- Subtle border glow -->
    <linearGradient id="border-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2c98a" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#c8a96e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8a6f3f" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Diamond top gradient -->
    <linearGradient id="diamond-grad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e2c98a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c8a96e" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Soft glow filter for letters -->
    <filter id="letter-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle shadow filter for the mark card -->
    <filter id="card-shadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════
       LEFT — MONOGRAM MARK
  ═══════════════════════════════════════════ -->

  <!-- Mark card shadow -->
  <rect x="8" y="8" width="104" height="104" rx="18" fill="#07060c"
        filter="url(#card-shadow)" opacity="0.6"/>

  <!-- Mark card background -->
  <rect x="8" y="8" width="104" height="104" rx="18" fill="url(#mark-bg)"/>

  <!-- Mark card outer border (gold) -->
  <rect x="8" y="8" width="104" height="104" rx="18"
        fill="none" stroke="url(#border-glow)" stroke-width="1.2"/>

  <!-- Mark card inner border (subtle) -->
  <rect x="12" y="12" width="96" height="96" rx="14"
        fill="none" stroke="#c8a96e" stroke-width="0.3" opacity="0.18"/>

  <!-- Diamond decorative element — top center of mark -->
  <polygon points="60,14 67,21 60,28 53,21"
           fill="url(#diamond-grad)" opacity="0.8"/>
  <!-- Diamond outline -->
  <polygon points="60,14 67,21 60,28 53,21"
           fill="none" stroke="#e2c98a" stroke-width="0.8" opacity="0.6"/>
  <!-- Diamond center dot -->
  <circle cx="60" cy="21" r="1.2" fill="#f0dfa0" opacity="0.9"/>

  <!-- Diamond decorative element — bottom center -->
  <polygon points="60,92 67,99 60,106 53,99"
           fill="none" stroke="#c8a96e" stroke-width="0.8" opacity="0.35"/>

  <!-- Corner bracket accents — all four corners -->
  <!-- TL -->
  <path d="M16 28 L16 16 L28 16" fill="none" stroke="#c8a96e"
        stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
  <!-- TR -->
  <path d="M92 16 L104 16 L104 28" fill="none" stroke="#c8a96e"
        stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
  <!-- BL -->
  <path d="M16 92 L16 104 L28 104" fill="none" stroke="#c8a96e"
        stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
  <!-- BR -->
  <path d="M92 104 L104 104 L104 92" fill="none" stroke="#c8a96e"
        stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>

  <!-- Ambient inner glow blob -->
  <ellipse cx="60" cy="60" rx="30" ry="26" fill="#c8a96e" opacity="0.05"/>

  <!-- "M" — large italic serif -->
  <text
    x="17" y="82"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="54"
    font-weight="700"
    font-style="italic"
    fill="url(#gold-main)"
    filter="url(#letter-glow)"
    letter-spacing="-3">M</text>

  <!-- "P" — large italic serif -->
  <text
    x="60" y="82"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="54"
    font-weight="700"
    font-style="italic"
    fill="url(#gold-main)"
    filter="url(#letter-glow)"
    letter-spacing="-2">P</text>

  <!-- Gold dot accent — top-right of letters -->
  <circle cx="103" cy="30" r="3.5" fill="#e2c98a" opacity="0.85"/>
  <circle cx="103" cy="30" r="1.5" fill="#ffffff" opacity="0.5"/>

  <!-- Thin decorative rule under letters -->
  <line x1="16" y1="87" x2="104" y2="87"
        stroke="#c8a96e" stroke-width="0.7" opacity="0.28"/>

  <!-- ═══════════════════════════════════════════
       DIVIDER — thin vertical gold line
  ═══════════════════════════════════════════ -->
  <line x1="132" y1="20" x2="132" y2="100"
        stroke="#c8a96e" stroke-width="0.8" opacity="0.25"/>

  <!-- Divider diamond ornament -->
  <polygon points="132,10 136,16 132,22 128,16"
           fill="#c8a96e" opacity="0.45"/>
  <polygon points="132,98 136,104 132,110 128,104"
           fill="#c8a96e" opacity="0.45"/>

  <!-- ═══════════════════════════════════════════
       RIGHT — WORDMARK
  ═══════════════════════════════════════════ -->

  <!-- Main name "Pratheesh" -->
  <text
    x="148" y="52"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="32"
    font-weight="700"
    font-style="italic"
    fill="url(#gold-text)"
    letter-spacing="0.5">Pratheesh</text>

  <!-- Main name "Pratheesh" — slightly different weight/shade -->
  <text
    x="148" y="82"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="32"
    font-weight="400"
    font-style="italic"
    fill="#c8a96e"
    letter-spacing="0.5"
    opacity="0.9">Pratheesh</text>

  <!-- Thin rule between name and tagline -->
  <line x1="148" y1="90" x2="510" y2="90"
        stroke="#c8a96e" stroke-width="0.6" opacity="0.22"/>

  <!-- Tagline — small caps style -->
  <text
    x="148" y="105"
    font-family="'Courier New', Courier, monospace"
    font-size="9.5"
    font-weight="400"
    fill="#9b7fe8"
    letter-spacing="2.8"
    opacity="0.85">WEB DEVELOPER</text>

  <!-- Separator dot in tagline -->
  <circle cx="332" cy="101" r="1.5" fill="#c8a96e" opacity="0.6"/>

  <!-- Second part of tagline -->
  <text
    x="340" y="105"
    font-family="'Courier New', Courier, monospace"
    font-size="9.5"
    font-weight="400"
    fill="#9b7fe8"
    letter-spacing="2.8"
    opacity="0.85">DIGITAL MARKETER</text>

  <!-- Verified/certified badge — small, top-right area -->
  <rect x="440" y="10" width="72" height="20" rx="3"
        fill="rgba(200,169,110,0.08)" stroke="#c8a96e" stroke-width="0.7" opacity="0.7"/>
  <text
    x="476" y="23"
    font-family="'Courier New', Courier, monospace"
    font-size="7.5"
    fill="#c8a96e"
    letter-spacing="1.5"
    text-anchor="middle"
    opacity="0.85">GOOGLE CERT.</text>

  <!-- Small star accent next to badge -->
  <text x="426" y="23" font-size="10" fill="#c8a96e" opacity="0.7">★</text>
</svg>
